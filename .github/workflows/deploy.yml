name: Deploy Website to Arenhost (Webhook)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Trigger Deploy via Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy webhook
        run: |
          curl -f "https://huseinalhafiz.my.id/deploy-webhook.php?token=${{ secrets.DEPLOY_TOKEN }}"